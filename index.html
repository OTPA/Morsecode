<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Morse Ear Trainer</title>
  <meta name="description" content="Learn Morse code by ear with the Koch method and Farnsworth spacing.">
  <meta name="theme-color" content="#1c1a17">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="top">
    <h1>Morse Ear Trainer</h1>
    <nav class="tabs" role="tablist" aria-label="Sections">
      <button role="tab" data-tab="today">Today</button>
      <button role="tab" data-tab="practice">Practice</button>
      <button role="tab" data-tab="voice">Voice</button>
      <button role="tab" data-tab="progress">Progress</button>
      <button role="tab" data-tab="settings">Settings</button>
    </nav>
    <nav class="tabs sub" id="subtabs" role="tablist" aria-label="Practice modes" hidden>
      <button role="tab" data-tab="learn">Learn</button>
      <button role="tab" data-tab="listen">Listen</button>
      <button role="tab" data-tab="words">Words</button>
      <button role="tab" data-tab="send">Send</button>
    </nav>
    <div id="sessionbar" class="sessionbar" hidden></div>
  </header>
  <main id="view" tabindex="-1"></main>
  <div id="live" class="sr" aria-live="polite" role="status"></div>
  <noscript><p class="card">This app needs JavaScript to play and check characters.</p></noscript>
  <script src="js/morse.js"></script>
  <script src="js/trainer.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/study.js"></script>
  <script src="js/words.js"></script>
  <script src="js/checks.js"></script>
  <script src="js/coach.js"></script>
  <script src="js/voiceparse.js"></script>
  <script src="js/voice.js"></script>
  <script src="js/audioedit.js"></script>
  <script src="js/clips.js"></script>
  <script src="js/tracks.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
